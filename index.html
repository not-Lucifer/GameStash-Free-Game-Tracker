<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Stash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <script>
        window.addEventListener('error', (e) => console.error(`JS Error: ${e.message} at ${e.filename}:${e.lineno}:${e.colno}`));
        window.addEventListener('unhandledrejection', (e) => console.error(`Unhandled rejection: ${e.reason}`));
    </script>

    <!-- SVG symbols used more than once -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></symbol>
        <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
        <symbol id="i-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></symbol>
        <symbol id="i-google" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></symbol>
        <symbol id="i-discord" viewBox="0 0 24 24" fill="#5865F2"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></symbol>
    </svg>

    <header class="masthead">
        <a class="wordmark" href="#" onclick="switchView('storefront'); return false;">Game Stash</a>

        <nav class="views" aria-label="Views">
            <button class="view-tab is-active" id="nav-storefront" onclick="switchView('storefront')">Free now <span class="tab-count" id="games-count"></span></button>
            <button class="view-tab" id="nav-library" onclick="switchView('library')" hidden>My stash <span class="tab-count" id="library-count"></span></button>
        </nav>

        <div class="masthead-tools">
            <label class="search">
                <svg><use href="#i-search"/></svg>
                <input type="search" id="search-input" placeholder="Search the table" aria-label="Search games" autocomplete="off">
            </label>
            <button class="icon-btn" id="refresh-button" onclick="refreshAllGames()" aria-label="Refresh the table" title="Refresh">
                <svg><use href="#i-refresh"/></svg>
            </button>
            <div class="account">
                <button class="btn btn-brass" id="signin-btn" onclick="openLoginModal()">Sign in</button>
                <div id="account-signed-in" hidden>
                    <button class="account-btn" id="account-btn" onclick="toggleProfileMenu()" aria-haspopup="menu" aria-expanded="false">
                        <span class="avatar" id="profile-avatar" aria-hidden="true">G</span>
                        <span id="profile-name">Guest</span>
                    </button>
                    <div class="menu" id="profile-menu" role="menu" hidden>
                        <button class="menu-item" role="menuitem" onclick="openProfileModal()"><svg><use href="#i-user"/></svg>My card</button>
                        <button class="menu-item" role="menuitem" onclick="signOut()"><svg><use href="#i-out"/></svg>Sign out</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="table">
        <!-- The table: what's free right now -->
        <section id="storefront-view" class="view" aria-labelledby="nav-storefront">
            <div id="featured"></div>

            <div class="table-bar">
                <div class="filters" role="group" aria-label="Store">
                    <button class="filter-btn is-active" data-filter="all">All <span class="count" data-count="all"></span></button>
                    <button class="filter-btn" data-filter="Steam">Steam <span class="count" data-count="Steam"></span></button>
                    <button class="filter-btn" data-filter="Epic">Epic <span class="count" data-count="Epic"></span></button>
                    <button class="filter-btn" data-filter="GOG">GOG <span class="count" data-count="GOG"></span></button>
                    <button class="filter-btn" data-filter="Itch">Itch.io <span class="count" data-count="Itch"></span></button>
                </div>
                <div class="sorts" role="group" aria-label="Sort">
                    <span class="sorts-label">Sort by</span>
                    <button class="sort-btn is-active" data-sort="newest">Newest</button>
                    <button class="sort-btn" data-sort="ending">Ending soon</button>
                    <button class="sort-btn" data-sort="value">Highest value</button>
                </div>
            </div>

            <div class="ticket-grid" id="games-grid" aria-live="polite"></div>
        </section>

        <!-- The stash: what you've claimed -->
        <section id="library-view" class="view" aria-labelledby="nav-library" hidden>
            <header class="stash-head">
                <h1>My stash</h1>
                <p class="stash-summary" id="stash-summary"></p>
            </header>
            <div class="ticket-grid" id="library-grid"></div>
        </section>
    </main>

    <div class="toasts" id="toast-container" aria-live="polite"></div>

    <!-- Sign in / create account -->
    <div class="modal" id="login-modal" role="dialog" aria-modal="true" aria-labelledby="login-title" hidden>
        <div class="modal-backdrop" onclick="closeLoginModal()"></div>
        <div class="modal-card">
            <button class="modal-close" onclick="closeLoginModal()" aria-label="Close"><svg><use href="#i-close"/></svg></button>
            <h2 class="modal-title" id="login-title">Keep your stash</h2>
            <p class="modal-lede">Sign in and every game you claim is saved here, on this PC.</p>

            <div class="auth-tabs" role="tablist">
                <button class="auth-tab is-active" id="tab-login" role="tab" aria-selected="true" onclick="switchAuthTab('login')">Sign in</button>
                <button class="auth-tab" id="tab-register" role="tab" aria-selected="false" onclick="switchAuthTab('register')">Create account</button>
            </div>

            <form class="auth-form" id="auth-form-login" onsubmit="loginWithEmail(); return false;">
                <button type="button" class="btn btn-quiet btn-block provider-btn" id="btn-google" onclick="loginWithOAuth('google')"><svg><use href="#i-google"/></svg>Continue with Google</button>
                <button type="button" class="btn btn-quiet btn-block provider-btn" id="btn-discord" disabled title="Discord sign-in is coming soon"><svg><use href="#i-discord"/></svg>Discord (coming soon)</button>
                <div class="divider">or with email</div>
                <div class="field"><label for="login-email">Email</label><input type="email" id="login-email" autocomplete="email" required></div>
                <div class="field"><label for="login-password">Password</label><input type="password" id="login-password" autocomplete="current-password" required></div>
                <div class="form-actions"><button type="submit" class="btn btn-ink btn-block btn-lg" id="btn-email-login">Sign in</button></div>
            </form>

            <form class="auth-form" id="auth-form-register" onsubmit="registerWithEmail(); return false;" hidden>
                <div class="field"><label for="reg-username">Username</label><input type="text" id="reg-username" maxlength="30" autocomplete="username" required></div>
                <div class="field"><label for="reg-email">Email</label><input type="email" id="reg-email" autocomplete="email" required></div>
                <div class="field"><label for="reg-password">Password</label><input type="password" id="reg-password" autocomplete="new-password" minlength="6" required><span class="field-hint">At least 6 characters</span></div>
                <div class="form-actions"><button type="submit" class="btn btn-ink btn-block btn-lg" id="btn-email-register">Create account</button></div>
            </form>

            <div class="form-error" id="auth-error" role="alert" hidden></div>
        </div>
    </div>

    <!-- Profile card -->
    <div class="modal" id="profile-modal" role="dialog" aria-modal="true" aria-labelledby="profile-title" hidden>
        <div class="modal-backdrop" onclick="closeProfileModal()"></div>
        <div class="modal-card is-wide">
            <button class="modal-close" onclick="closeProfileModal()" aria-label="Close"><svg><use href="#i-close"/></svg></button>
            <div class="profile-head">
                <span class="avatar" id="profile-large-avatar" aria-hidden="true">G</span>
                <div>
                    <h2 class="profile-name" id="profile-title"></h2>
                    <p class="profile-since" id="profile-since"></p>
                </div>
            </div>
            <div class="profile-figures">
                <div class="figure"><b id="stat-games-claimed">0</b><span>games stashed</span></div>
                <div class="figure"><b id="stat-total-worth">Rs. 0</b><span>in list prices</span></div>
            </div>
            <form class="profile-form" onsubmit="saveProfileChanges(); return false;">
                <div class="field">
                    <label for="profile-bio">About you</label>
                    <textarea id="profile-bio" maxlength="200" rows="3" placeholder="What do you play?"></textarea>
                    <span class="field-hint" id="bio-char-count">0/200</span>
                </div>
                <div class="field-row">
                    <div class="field"><label for="profile-country">Country</label><input type="text" id="profile-country" maxlength="50"></div>
                    <div class="field">
                        <label for="profile-favorite-platform">Favourite store</label>
                        <select id="profile-favorite-platform">
                            <option value="">Choose one</option>
                            <option value="Steam">Steam</option>
                            <option value="Epic Games">Epic Games</option>
                            <option value="GOG">GOG</option>
                            <option value="Itch.io">Itch.io</option>
                        </select>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-quiet" onclick="closeProfileModal()">Cancel</button>
                    <button type="submit" class="btn btn-brass" id="btn-save-profile">Save changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Claim: step 1, open the store -->
    <div class="modal" id="claim-confirm" role="dialog" aria-modal="true" aria-labelledby="claim-confirm-title" hidden>
        <div class="modal-backdrop" onclick="dismissClaim()"></div>
        <div class="modal-card">
            <button class="modal-close" onclick="dismissClaim()" aria-label="Close"><svg><use href="#i-close"/></svg></button>
            <h2 class="modal-title" id="claim-confirm-title"></h2>
            <p class="modal-lede" id="claim-confirm-lede"></p>
            <div class="modal-actions">
                <button class="btn btn-quiet" onclick="dismissClaim()">Cancel</button>
                <button class="btn btn-brass" id="claim-confirm-go" onclick="proceedToStore()">Open store</button>
            </div>
        </div>
    </div>

    <!-- Claim: step 2, did you get it? -->
    <div class="modal" id="claim-verify" role="dialog" aria-modal="true" aria-labelledby="claim-verify-title" hidden>
        <div class="modal-backdrop"></div>
        <div class="modal-card">
            <h2 class="modal-title" id="claim-verify-title"></h2>
            <p class="modal-lede" id="claim-verify-lede"></p>
            <div class="modal-actions">
                <button class="btn btn-quiet" onclick="dismissClaim()">Not yet</button>
                <button class="btn btn-brass" id="claim-verify-yes" onclick="confirmGameClaimed()">Yes, add to my stash</button>
            </div>
        </div>
    </div>

    <script>
        // ─── Helpers ────────────────────────────────────────────────────────
        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const debug_log = (msg) => console.log('[GameStash] ' + msg);
        const parseResult = (r) => (typeof r === 'string' ? JSON.parse(r) : r);

        const STORES = [
            { key: 'Steam', label: 'Steam', match: ['Steam'] },
            { key: 'Epic',  label: 'Epic',  match: ['Epic Games'] },
            { key: 'GOG',   label: 'GOG',   match: ['GOG'] },
            { key: 'Itch',  label: 'Itch.io', match: ['Itch', 'itch'] },
        ];
        const DAY_MS = 86400000;

        function storeOf(platforms) {
            const p = platforms || '';
            return STORES.find((s) => s.match.some((m) => p.includes(m))) || null;
        }
        function matchesStore(game, key) {
            if (key === 'all') return true;
            const store = STORES.find((s) => s.key === key);
            return !!store && store.match.some((m) => (game.platforms || '').includes(m));
        }
        // API dates look like "2026-10-01 23:59:00"; "N/A" when open-ended
        function parseApiDate(s) {
            if (!s || s === 'N/A') return null;
            const d = new Date(String(s).replace(' ', 'T'));
            return isNaN(d) ? null : d;
        }
        function daysLeft(game) {
            const end = parseApiDate(game.end_date);
            if (!end) return null;
            const days = Math.ceil((end - Date.now()) / DAY_MS);
            return days < 0 ? null : days;
        }
        function endsText(game) {
            const d = daysLeft(game);
            if (d === null) return '';
            if (d === 0) return 'Ends today';
            if (d === 1) return '1 day left';
            return d + ' days left';
        }
        function endsLong(game) {
            const d = daysLeft(game);
            if (d === null) return 'No end date announced — grab it while it lasts';
            const end = parseApiDate(game.end_date);
            const when = end.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'short' });
            if (d === 0) return 'Ends today, ' + when;
            if (d === 1) return 'Ends tomorrow, ' + when;
            return 'Ends in ' + d + ' days, on ' + when;
        }
        function worthNumber(worth_inr) {
            const m = String(worth_inr || '').match(/\d+(?:\.\d+)?/);
            return m ? parseFloat(m[0]) : 0;
        }
        function worthText(worth_inr) {
            const n = worthNumber(worth_inr);
            return n > 0 ? 'Rs. ' + n.toLocaleString('en-IN', { maximumFractionDigits: 0 }) : '';
        }
        // "Deadshot (Steam) Giveaway" -> "Deadshot"; the store is on the ticket already
        function displayTitle(game) {
            return String(game.title || '')
                .replace(/\s*\((?:Steam|Epic Games?(?: Store)?|GOG|Itch\.io|Indiegala|Fanatical|Amazon(?: Games)?|Prime Gaming|Microsoft Store|Ubisoft)\)/gi, '')
                .replace(/\s+(?:Key\s+)?Giveaway$/i, '')
                .replace(/\s*\((?:itch\.?io|steam|epic|gog)\)$/i, '')
                .replace(/\s+(?:Steam|Epic Games|GOG|Itch\.io)$/i, '')
                .trim() || String(game.title || '');
        }
        function chipText(game) {
            const store = storeOf(game.platforms);
            return store ? store.label : (game.platforms || 'PC');
        }
        function gameById(id) {
            return allGames.find((g) => g.id === id) || claimedGames.find((g) => g.id === id) || null;
        }

        // ─── State ──────────────────────────────────────────────────────────
        let allGames = [];
        let claimedGames = [];
        let currentUser = null;
        let currentFilter = 'all';
        let currentSort = 'newest';
        let currentView = 'storefront';
        let searchQuery = '';
        let pendingGameClaim = null;   // read by C++ (navigateBack) — keep global
        let openModals = [];

        // ─── Rendering: tickets ─────────────────────────────────────────────
        function ticketMeta(game, big) {
            const was = worthText(game.worth_inr);
            const type = game.type && game.type !== 'Game' ? esc(game.type) : '';
            return `<p class="ticket-meta">${was ? `<s>${was}</s>` : ''}<span class="free-tag">Free</span>${type ? `<span>${type}</span>` : ''}</p>`;
        }
        function ticketHTML(game, i) {
            const store = storeOf(game.platforms);
            const stashed = isGameClaimed(game.id);
            const ends = endsText(game);
            const d = daysLeft(game);
            const action = stashed
                ? `<button class="btn btn-quiet" data-action="open" data-game-id="${game.id}">Open ${store ? store.label : 'store'}</button>`
                : `<button class="btn btn-ink" data-action="claim" data-game-id="${game.id}">Claim${store ? ' on ' + store.label : ''}</button>`;
            return `
                <article class="ticket${stashed ? ' is-stamped' : ''}" data-game-id="${game.id}" style="--i:${i}">
                    <div class="ticket-art" style="background-image:url('${esc(game.thumbnail)}')">
                        <span class="ticket-platform">${esc(chipText(game))}</span>
                        ${ends ? `<span class="ticket-ends${d !== null && d <= 2 ? ' is-urgent' : ''}">${ends}</span>` : ''}
                    </div>
                    <div class="ticket-tear"></div>
                    <div class="ticket-body">
                        ${stashed ? '<span class="stamp">Claimed</span>' : ''}
                        <h3 class="ticket-title">${esc(displayTitle(game))}</h3>
                        ${ticketMeta(game)}
                        <div class="ticket-actions">${action}</div>
                    </div>
                </article>`;
        }
        function stashTicketHTML(game, i) {
            const store = storeOf(game.platforms);
            const on = new Date(game.claimed_at);
            const onText = isNaN(on) ? '' : on.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
            return `
                <article class="ticket is-stamped" data-game-id="${game.id}" style="--i:${i}">
                    <div class="ticket-art" style="background-image:url('${esc(game.thumbnail)}')">
                        <span class="ticket-platform">${esc(chipText(game))}</span>
                    </div>
                    <div class="ticket-tear"></div>
                    <div class="ticket-body">
                        <span class="stamp">Claimed</span>
                        <h3 class="ticket-title">${esc(displayTitle(game))}</h3>
                        <p class="stashed-on">${onText ? 'Stashed ' + onText : ''}${worthText(game.worth_inr) ? (onText ? ', list price ' : 'List price ') + worthText(game.worth_inr) : ''}</p>
                        <div class="ticket-actions"><button class="btn btn-quiet" data-action="open" data-game-id="${game.id}">Open ${store ? store.label : 'store'}</button></div>
                    </div>
                </article>`;
        }
        function featuredHTML(game) {
            const store = storeOf(game.platforms);
            const stashed = isGameClaimed(game.id);
            const d = daysLeft(game);
            const why = d !== null ? 'Ending soonest on the table' : 'Newest on the table';
            const action = stashed
                ? `<button class="btn btn-quiet btn-lg" data-action="open" data-game-id="${game.id}">Open ${store ? store.label : 'store'}</button>`
                : `<button class="btn btn-brass btn-lg" data-action="claim" data-game-id="${game.id}">Claim${store ? ' on ' + store.label : ''}</button>`;
            return `
                <article class="ticket featured" data-game-id="${game.id}">
                    <div class="featured-art" style="background-image:url('${esc(game.image || game.thumbnail)}')">
                        <span class="ticket-platform">${esc(chipText(game))}</span>
                    </div>
                    <div class="featured-tear"></div>
                    <div class="featured-body">
                        ${stashed ? '<span class="stamp">Claimed</span>' : ''}
                        <p class="featured-why">${why}</p>
                        <h1 class="featured-title">${esc(displayTitle(game))}</h1>
                        ${ticketMeta(game, true)}
                        <p class="featured-ends${d !== null && d <= 2 ? ' is-urgent' : ''}">${endsLong(game)}</p>
                        <div class="featured-actions">${action}</div>
                    </div>
                </article>`;
        }
        function noteHTML(title, body, cta) {
            return `<div class="table-note"><h3>${title}</h3><p>${body}</p>${cta || ''}</div>`;
        }

        // ─── Rendering: the table ───────────────────────────────────────────
        function visibleGames() {
            const q = searchQuery.toLowerCase();
            let list = allGames.filter((g) => matchesStore(g, currentFilter) && (!q || (g.title || '').toLowerCase().includes(q)));
            if (currentSort === 'ending') {
                list = list.slice().sort((a, b) => (daysLeft(a) ?? 1e9) - (daysLeft(b) ?? 1e9));
            } else if (currentSort === 'value') {
                list = list.slice().sort((a, b) => worthNumber(b.worth_inr) - worthNumber(a.worth_inr));
            }
            return list;
        }
        function pickFeatured(list) {
            const dated = list.filter((g) => daysLeft(g) !== null);
            if (dated.length) return dated.reduce((a, b) => (daysLeft(a) <= daysLeft(b) ? a : b));
            return list[0] || null;
        }
        function renderTable(deal) {
            const grid = $('games-grid');
            const featuredEl = $('featured');
            const list = visibleGames();

            STORES.concat([{ key: 'all' }]).forEach((s) => {
                const el = document.querySelector(`[data-count="${s.key}"]`);
                if (el) el.textContent = allGames.filter((g) => matchesStore(g, s.key)).length;
            });
            $('games-count').textContent = allGames.length || '';

            if (allGames.length === 0) {
                featuredEl.innerHTML = '';
                grid.innerHTML = noteHTML('Nothing on the table right now', 'Try refreshing in a moment, or check your internet connection.',
                    '<button class="btn btn-chalk" onclick="refreshAllGames()">Refresh</button>');
                return;
            }
            if (list.length === 0) {
                featuredEl.innerHTML = '';
                grid.innerHTML = noteHTML('No games match', searchQuery ? `Nothing on the table is called “${esc(searchQuery)}”.` : 'Nothing free on this store right now.');
                return;
            }

            const featured = pickFeatured(list);
            featuredEl.innerHTML = featuredHTML(featured);
            const rest = list.filter((g) => g !== featured);
            grid.classList.toggle('is-dealing', !!deal);
            grid.innerHTML = rest.map((g, i) => ticketHTML(g, Math.min(i, 24))).join('');
            if (deal) setTimeout(() => grid.classList.remove('is-dealing'), 1500);
        }
        function renderSkeleton() {
            $('featured').innerHTML = '';
            $('games-grid').innerHTML = Array.from({ length: 8 }, () => `
                <div class="ticket is-skeleton" aria-hidden="true">
                    <div class="ticket-art"></div><div class="ticket-tear"></div>
                    <div class="ticket-body"><div class="sk-line"></div><div class="sk-line"></div><div class="sk-btn"></div></div>
                </div>`).join('');
        }

        // ─── Rendering: the stash ───────────────────────────────────────────
        function renderLibrary() {
            const grid = $('library-grid');
            const q = searchQuery.toLowerCase();
            const total = claimedGames.reduce((sum, g) => sum + worthNumber(g.worth_inr), 0);
            $('stash-summary').textContent = claimedGames.length
                ? `${claimedGames.length} ${claimedGames.length === 1 ? 'game' : 'games'} worth Rs. ${total.toLocaleString('en-IN', { maximumFractionDigits: 0 })} at list price`
                : '';

            if (claimedGames.length === 0) {
                grid.innerHTML = noteHTML('Nothing stashed yet', 'Claim a game from the table and it will show up here.',
                    '<button class="btn btn-chalk" onclick="switchView(\'storefront\')">See what’s free</button>');
                return;
            }
            const list = claimedGames.filter((g) => !q || (g.title || '').toLowerCase().includes(q));
            grid.innerHTML = list.length
                ? list.map(stashTicketHTML).join('')
                : noteHTML('No games match', `Nothing in your stash is called “${esc(searchQuery)}”.`);
        }
        function updateLibraryCount() {
            $('library-count').textContent = claimedGames.length || '';
        }

        // ─── Views, filters, sort, search ───────────────────────────────────
        function switchView(view) {
            currentView = view;
            $('storefront-view').hidden = view !== 'storefront';
            $('library-view').hidden = view !== 'library';
            $('nav-storefront').classList.toggle('is-active', view === 'storefront');
            $('nav-library').classList.toggle('is-active', view === 'library');
            $('search-input').placeholder = view === 'library' ? 'Search your stash' : 'Search the table';
            if (view === 'library') renderLibrary();
            window.scrollTo(0, 0);
        }
        function rerender() {
            if (currentView === 'library') renderLibrary(); else renderTable(false);
        }

        // ─── Claim flow ─────────────────────────────────────────────────────
        // Claim → open the store in the system browser → ask whether it worked → stash it.
        function openStore(game) {
            if (typeof openSystemBrowser !== 'undefined') openSystemBrowser(game.open_giveaway_url, game.platforms || '');
            else window.open(game.open_giveaway_url, '_blank');
        }
        function startClaim(game) {
            const store = storeOf(game.platforms);
            pendingGameClaim = game;
            $('claim-confirm-title').textContent = 'Claim ' + displayTitle(game) + '?';
            $('claim-confirm-lede').textContent = `We’ll open ${store ? store.label : 'the store'} in your browser. Claim the game there, then come back here and add it to your stash.`;
            $('claim-confirm-go').textContent = 'Open ' + (store ? store.label : 'store');
            openModal('claim-confirm');
        }
        function proceedToStore() {
            const game = pendingGameClaim;
            if (!game) return;
            closeModal('claim-confirm');
            localStorage.setItem('_pendingClaimGame', JSON.stringify(game));
            openStore(game);
            setTimeout(() => { if (pendingGameClaim === game) showClaimVerification(game); }, 900);
        }
        // Also called by C++ after navigateBack — keep the name and signature.
        function showClaimVerification(game) {
            if (!game) return;
            pendingGameClaim = game;
            const store = storeOf(game.platforms);
            $('claim-verify-title').textContent = 'Did you claim ' + displayTitle(game) + '?';
            $('claim-verify-lede').textContent = `Once it’s in your ${store ? store.label : 'store'} account, add it to your stash so you don’t grab it twice.`;
            $('claim-verify-yes').disabled = false;
            $('claim-verify-yes').textContent = 'Yes, add to my stash';
            openModal('claim-verify');
        }
        function dismissClaim() {
            pendingGameClaim = null;
            localStorage.removeItem('_pendingClaimGame');
            closeModal('claim-confirm');
            closeModal('claim-verify');
        }
        async function confirmGameClaimed() {
            const game = pendingGameClaim;
            if (!game) return;
            if (!currentUser) {
                closeModal('claim-verify');
                openLoginModal();
                showToast('Sign in to keep your stash');
                return;   // pendingGameClaim survives; onLoginSuccess re-asks
            }
            const btn = $('claim-verify-yes');
            btn.disabled = true;
            btn.textContent = 'Adding…';
            try {
                const ok = await claimGame(game);
                if (ok) {
                    localStorage.removeItem('_pendingClaimGame');
                    pendingGameClaim = null;
                    closeModal('claim-verify');
                    rerender();
                    document.querySelectorAll(`.ticket[data-game-id="${game.id}"] .stamp`).forEach((s) => s.classList.add('is-fresh'));
                    showToast(displayTitle(game) + ' added to your stash');
                } else {
                    showToast('Couldn’t add it to your stash. Try again.');
                }
            } catch (e) {
                showToast('Couldn’t add it to your stash: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Yes, add to my stash';
            }
        }

        // ─── Stash (SQLite-backed via C++) ──────────────────────────────────
        async function loadClaimedGamesFromDB() {
            if (!currentUser || !currentUser.db_id) { claimedGames = []; updateLibraryCount(); return; }
            try {
                const result = parseResult(await getClaimedGames(currentUser.db_id));
                claimedGames = Array.isArray(result) ? result : [];
            } catch (e) { claimedGames = []; }
            updateLibraryCount();
        }
        function isGameClaimed(gameId) {
            return claimedGames.some((g) => g.id === gameId);
        }
        async function claimGame(game) {
            if (!currentUser || !currentUser.db_id) return false;
            if (isGameClaimed(game.id)) return true;
            if (typeof dbClaimGame === 'undefined') return false;
            await dbClaimGame(currentUser.db_id, game);
            claimedGames.unshift({
                id: game.id, title: game.title, thumbnail: game.thumbnail, platforms: game.platforms,
                worth_inr: game.worth_inr, open_giveaway_url: game.open_giveaway_url, claimed_at: new Date().toISOString(),
            });
            updateLibraryCount();
            return true;
        }

        // ─── Session ────────────────────────────────────────────────────────
        function loadUserSession() {
            const stored = localStorage.getItem('gamestash_user');
            if (!stored) return;
            try {
                currentUser = JSON.parse(stored);
                loadClaimedGamesFromDB().then(onLoginSuccess);
            } catch (e) { currentUser = null; }
        }
        function saveUserSession() {
            if (currentUser) localStorage.setItem('gamestash_user', JSON.stringify(currentUser));
            else localStorage.removeItem('gamestash_user');
        }
        function setAvatar(el, avatar, name, color) {
            if (avatar && avatar.startsWith('http')) {
                el.innerHTML = `<img src="${esc(avatar)}" alt="">`;
                el.style.background = 'transparent';
            } else {
                el.textContent = (name || 'G').charAt(0).toUpperCase();
                el.style.background = color || '';
            }
        }
        function onLoginSuccess() {
            $('signin-btn').hidden = true;
            $('account-signed-in').hidden = false;
            $('nav-library').hidden = false;
            setAvatar($('profile-avatar'), currentUser.avatar, currentUser.name, currentUser.color);
            $('profile-name').textContent = currentUser.name;
            updateLibraryCount();
            rerender();
            if (pendingGameClaim) showClaimVerification(pendingGameClaim);
        }
        function signOut() {
            currentUser = null;
            claimedGames = [];
            localStorage.removeItem('gamestash_user');
            $('signin-btn').hidden = false;
            $('account-signed-in').hidden = true;
            $('nav-library').hidden = true;
            $('profile-menu').hidden = true;
            $('account-btn').setAttribute('aria-expanded', 'false');
            if (currentView === 'library') switchView('storefront');
            updateLibraryCount();
            rerender();
            showToast('Signed out');
        }
        function toggleProfileMenu() {
            const menu = $('profile-menu');
            menu.hidden = !menu.hidden;
            $('account-btn').setAttribute('aria-expanded', String(!menu.hidden));
        }
        document.addEventListener('click', (e) => {
            const wrap = $('account-signed-in');
            if (wrap && !wrap.hidden && !wrap.contains(e.target)) {
                $('profile-menu').hidden = true;
                $('account-btn').setAttribute('aria-expanded', 'false');
            }
        });

        // ─── Sign in / register ─────────────────────────────────────────────
        function switchAuthTab(tab) {
            $('auth-form-login').hidden = tab !== 'login';
            $('auth-form-register').hidden = tab !== 'register';
            $('tab-login').classList.toggle('is-active', tab === 'login');
            $('tab-register').classList.toggle('is-active', tab === 'register');
            $('tab-login').setAttribute('aria-selected', String(tab === 'login'));
            $('tab-register').setAttribute('aria-selected', String(tab === 'register'));
            hideAuthError();
        }
        function showAuthError(msg) { const el = $('auth-error'); el.textContent = msg; el.hidden = false; }
        function hideAuthError() { $('auth-error').hidden = true; }

        function setUserFromResponse(user, fallbackName) {
            currentUser = {
                id: user.db_id || user.id,
                db_id: user.db_id || user.id,
                name: user.name || fallbackName,
                email: user.email || '',
                provider: 'Email',
                avatar: (user.name || fallbackName || 'G').charAt(0).toUpperCase(),
                color: '',
            };
        }
        async function loginWithEmail() {
            hideAuthError();
            const email = $('login-email').value.trim();
            const password = $('login-password').value;
            if (!email || !password) { showAuthError('Enter your email and password.'); return; }
            const btn = $('btn-email-login');
            btn.disabled = true; btn.textContent = 'Signing in…';
            try {
                const res = parseResult(await loginUser(email, password));
                if (res.error) { showAuthError(res.error); return; }
                setUserFromResponse(res.user);
                saveUserSession();
                await loadClaimedGamesFromDB();
                onLoginSuccess();
                closeLoginModal();
                showToast('Welcome back, ' + currentUser.name);
            } catch (e) { showAuthError('Couldn’t sign in: ' + e.message); }
            finally { btn.disabled = false; btn.textContent = 'Sign in'; }
        }
        async function registerWithEmail() {
            hideAuthError();
            const username = $('reg-username').value.trim();
            const email = $('reg-email').value.trim();
            const password = $('reg-password').value;
            if (!username || !email || !password) { showAuthError('Fill in a username, email and password.'); return; }
            if (password.length < 6) { showAuthError('Password needs at least 6 characters.'); return; }
            const btn = $('btn-email-register');
            btn.disabled = true; btn.textContent = 'Creating…';
            try {
                const res = parseResult(await registerUser(username, email, password));
                if (res.error) { showAuthError(res.error); return; }
                setUserFromResponse(res.user, username);
                saveUserSession();
                await loadClaimedGamesFromDB();
                onLoginSuccess();
                closeLoginModal();
                showToast('Account created. Welcome, ' + currentUser.name);
            } catch (e) { showAuthError('Couldn’t create the account: ' + e.message); }
            finally { btn.disabled = false; btn.textContent = 'Create account'; }
        }
        async function loginWithOAuth(provider) {
            hideAuthError();
            try {
                closeLoginModal();
                showToast('Opening ' + provider + ' sign-in…');
                const res = parseResult(await startOAuth(provider));
                if (res && res.error) throw new Error(res.error);
            } catch (e) {
                openLoginModal();
                showAuthError('Couldn’t start ' + provider + ' sign-in: ' + e.message);
            }
        }
        // Called by C++ once the OAuth callback server has a result — keep the name.
        async function handleOAuthResult(result) {
            if (!result || !result.name) {
                openLoginModal();
                showAuthError('Sign-in didn’t complete. Try again.');
                return;
            }
            currentUser = {
                id: result.db_id || result.user_id,
                db_id: result.db_id,
                name: result.name,
                email: result.email || '',
                provider: result.provider || 'oauth',
                avatar: result.avatar || result.name.charAt(0).toUpperCase(),
                color: result.provider === 'google' ? '#4285F4' : '#5865F2',
            };
            saveUserSession();
            await loadClaimedGamesFromDB();
            onLoginSuccess();
            closeLoginModal();
            showToast('Welcome, ' + currentUser.name);
        }
        function openLoginModal() { switchAuthTab('login'); openModal('login-modal', 'login-email'); }
        function closeLoginModal() { closeModal('login-modal'); }

        // ─── Profile card ───────────────────────────────────────────────────
        async function openProfileModal() {
            if (!currentUser) { openLoginModal(); return; }
            const userId = currentUser.db_id || currentUser.id;
            $('profile-menu').hidden = true;
            $('account-btn').setAttribute('aria-expanded', 'false');
            try {
                const data = parseResult(await getUserProfile(userId));
                if (!data.success) { showToast('Couldn’t load your card: ' + (data.error || 'unknown error')); return; }
                const p = data.profile || {};
                $('profile-title').textContent = p.username || currentUser.name;
                const since = new Date(String(p.created_at || '').replace(' ', 'T'));
                $('profile-since').innerHTML = [p.email, isNaN(since) ? '' : 'Member since ' + since.toLocaleDateString('en-IN', { month: 'short', year: 'numeric' })].filter(Boolean).map(esc).join('<br>');
                setAvatar($('profile-large-avatar'), p.avatar, p.username, currentUser.color);
                $('profile-bio').value = p.bio || '';
                $('profile-country').value = p.country || '';
                $('profile-favorite-platform').value = p.favorite_platform || '';
                updateBioCharCount();
                const total = claimedGames.reduce((sum, g) => sum + worthNumber(g.worth_inr), 0);
                $('stat-games-claimed').textContent = claimedGames.length;
                $('stat-total-worth').textContent = 'Rs. ' + total.toLocaleString('en-IN', { maximumFractionDigits: 0 });
                openModal('profile-modal', 'profile-bio');
            } catch (e) {
                showToast('Couldn’t load your card: ' + e.message);
            }
        }
        function closeProfileModal() { closeModal('profile-modal'); }
        function updateBioCharCount() { $('bio-char-count').textContent = $('profile-bio').value.length + '/200'; }
        async function saveProfileChanges() {
            if (!currentUser) return;
            const btn = $('btn-save-profile');
            btn.disabled = true; btn.textContent = 'Saving…';
            try {
                const res = parseResult(await updateUserProfile(currentUser.db_id, {
                    bio: $('profile-bio').value,
                    country: $('profile-country').value,
                    favorite_platform: $('profile-favorite-platform').value,
                }));
                if (res.success) { showToast('Card saved'); closeProfileModal(); }
                else showToast('Couldn’t save: ' + (res.error || 'unknown error'));
            } catch (e) {
                showToast('Couldn’t save: ' + e.message);
            } finally { btn.disabled = false; btn.textContent = 'Save changes'; }
        }

        // ─── Modals ─────────────────────────────────────────────────────────
        function openModal(id, focusId) {
            const m = $(id);
            if (!m.hidden) return;
            m.hidden = false;
            openModals.push(id);
            requestAnimationFrame(() => {
                m.classList.add('is-open');
                const target = focusId ? $(focusId) : (m.querySelector('.btn-brass') || m.querySelector('.btn-ink') || m.querySelector('input, button'));
                if (target) target.focus();
            });
        }
        function closeModal(id) {
            const m = $(id);
            if (m.hidden) return;
            m.classList.remove('is-open');
            openModals = openModals.filter((x) => x !== id);
            setTimeout(() => { m.hidden = true; }, 200);
        }
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape' || openModals.length === 0) return;
            const top = openModals[openModals.length - 1];
            if (top === 'claim-verify' || top === 'claim-confirm') dismissClaim();
            else closeModal(top);
        });

        // ─── Toasts ─────────────────────────────────────────────────────────
        function showToast(message, duration = 3200) {
            const el = document.createElement('div');
            el.className = 'toast';
            el.textContent = message;
            $('toast-container').appendChild(el);
            requestAnimationFrame(() => el.classList.add('is-shown'));
            setTimeout(() => { el.classList.remove('is-shown'); setTimeout(() => el.remove(), 250); }, duration);
        }

        // ─── Loading the table ──────────────────────────────────────────────
        async function loadGames(deal) {
            renderSkeleton();
            try {
                if (typeof fetchGiveaways === 'undefined') throw new Error('the app bridge isn’t loaded');
                const res = parseResult(await fetchGiveaways());
                if (res && !Array.isArray(res) && res.error) throw new Error(res.error);
                allGames = Array.isArray(res) ? res : [];
                renderTable(deal);
                if (allGames.length && typeof sendNotification !== 'undefined') {
                    sendNotification('Game Stash', allGames.length + ' free games on the table');
                }
            } catch (error) {
                allGames = [];
                $('featured').innerHTML = '';
                $('games-grid').innerHTML = `<div class="table-note is-error"><h3>Couldn’t load the table</h3><p>${esc(error.message || 'Something went wrong')}.</p><button class="btn btn-chalk" onclick="refreshAllGames()">Try again</button></div>`;
            }
        }
        function refreshAllGames() {
            const btn = $('refresh-button');
            btn.disabled = true;
            btn.classList.add('is-spinning');
            loadGames(false).finally(() => { btn.disabled = false; btn.classList.remove('is-spinning'); });
        }

        // ─── Init ───────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            // Ticket buttons (delegated, so re-rendering never loses handlers)
            document.addEventListener('click', (e) => {
                const btn = e.target.closest('[data-action]');
                if (!btn) return;
                const game = gameById(parseInt(btn.dataset.gameId, 10));
                if (!game) return;
                if (btn.dataset.action === 'open') openStore(game);
                else if (btn.dataset.action === 'claim') startClaim(game);
            });

            document.querySelectorAll('.filter-btn').forEach((btn) => btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach((b) => b.classList.remove('is-active'));
                btn.classList.add('is-active');
                currentFilter = btn.dataset.filter;
                renderTable(false);
            }));
            document.querySelectorAll('.sort-btn').forEach((btn) => btn.addEventListener('click', () => {
                document.querySelectorAll('.sort-btn').forEach((b) => b.classList.remove('is-active'));
                btn.classList.add('is-active');
                currentSort = btn.dataset.sort;
                renderTable(false);
            }));

            let searchTimer;
            $('search-input').addEventListener('input', (e) => {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => { searchQuery = e.target.value.trim(); rerender(); }, 200);
            });
            $('profile-bio').addEventListener('input', updateBioCharCount);

            loadUserSession();

            // Came back from a store with a claim still open? Ask again.
            const stored = localStorage.getItem('_pendingClaimGame');
            if (stored) {
                try { setTimeout(() => showClaimVerification(JSON.parse(stored)), 500); }
                catch (e) { localStorage.removeItem('_pendingClaimGame'); }
            }

            loadGames(true);
        });
    </script>
</body>
</html>
